<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account — KowoPay</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="auth-page">
    <a href="index.html" style="margin-bottom:22px;">
      <img src="assets/kowopay-logo.svg" alt="KowoPay" height="44" />
    </a>

    <div class="auth-card">
      <h1>Create Your KowoPay Wallet</h1>
      <p class="subtitle">Get an instant 10-digit NUBAN account number and ₦5,000 welcome bonus.</p>

      <div id="authAlert" class="alert"></div>

      <form id="signupForm">
        <div class="form-group">
          <label for="fullName">Full Name</label>
          <input type="text" id="fullName" class="form-control" placeholder="e.g. Babalola Oluwafemi Emmanuel" required />
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="you@example.com" required />
        </div>

        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" class="form-control" placeholder="08031234567" required />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="Minimum 6 characters" minlength="6" required />
        </div>

        <div class="form-group">
          <label for="pin">4-Digit Transaction PIN</label>
          <input type="password" id="pin" class="form-control" placeholder="e.g. 1234" maxlength="4" pattern="\d{4}" required />
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg">Create Free Account</button>
      </form>

      <p style="text-align:center;margin-top:20px;font-size:0.9rem;color:var(--text-secondary);">
        Already have an account? <a href="login.html" style="color:var(--accent-cyan);font-weight:600;">Log In</a>
      </p>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="auth.js"></script>
</body>
</html>
